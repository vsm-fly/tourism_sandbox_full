{% extends "base.html" %}
{% block content %}
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0">Счета банка</h4>
    <a class="btn btn-primary" href="{{ url_for('banks.accounts_new') }}">Добавить счёт</a>
  </div>

  <form class="mb-3" method="get" action="{{ url_for('banks.accounts_list') }}">
    <div class="input-group">
      <input class="form-control" type="search" name="q" value="{{ q or '' }}" placeholder="Поиск по банку/счёту/валюте">
      <button class="btn btn-outline-secondary" type="submit">Найти</button>
    </div>
  </form>

  <div class="table-responsive">
    <table class="table table-striped align-middle">
      <thead>
        <tr>
          <th style="width:80px">ID</th>
          <th>Банк</th>
          <th>Счёт</th>
          <th style="width:120px">Валюта</th>
          <th style="width:220px">Действия</th>
        </tr>
      </thead>
      <tbody>
        {% for a in accounts %}
        <tr>
          <td>{{ a.id }}</td>
          <td>{{ a.bank_name }}</td>
          <td><code>{{ a.number }}</code></td>
          <td>{{ a.currency }}</td>
          <td class="text-end text-nowrap">
            <a class="btn btn-sm btn-outline-primary" href="{{ url_for('banks.accounts_edit', acc_id=a.id) }}">Редактировать</a>
            <form method="post"
                  action="{{ url_for('banks.accounts_delete', acc_id=a.id) }}"
                  class="d-inline"
                  onsubmit="return confirm('Удалить счёт {{ a.number }}?')">
              <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
              <button class="btn btn-sm btn-danger">Удалить</button>
            </form>
          </td>
        </tr>
        {% else %}
        <tr><td colspan="5" class="text-muted">Пока нет ни одного счёта</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
